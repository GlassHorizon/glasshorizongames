<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Horizon | Independent Game Studio</title>
    <meta name="description" content="Glass Horizon is an independent game studio crafting focused, systems-driven PC games. New projects coming in 2027.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://glasshorizongames.com/">

    <!-- Open Graph / Social Previews -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://glasshorizongames.com/">
    <meta property="og:title" content="Glass Horizon | Independent Game Studio">
    <meta property="og:description" content="An independent game studio crafting focused, systems-driven games. New experiences arriving in 2027.">
    <meta property="og:image" content="https://glasshorizongames.com/assets/favicon.png">

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:site" content="@GlassHorizonDev">
    <meta name="twitter:title" content="Glass Horizon | Independent Game Studio">
    <meta name="twitter:description" content="An independent game studio crafting focused, systems-driven games. New experiences arriving in 2027.">
    <meta name="twitter:image" content="https://glasshorizongames.com/assets/favicon.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png">

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">

    <!-- Structured Data (SEO) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Glass Horizon",
      "url": "https://glasshorizongames.com/",
      "logo": "https://glasshorizongames.com/assets/favicon.png",
      "email": "contact@glasshorizongames.com",
      "sameAs": [
        "https://x.com/GlassHorizonDev"
      ]
    }
    </script>
</head>
<body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <main class="studio-shell">
        <section class="studio-card" aria-labelledby="studio-heading">
            <div class="emblem-frame">
                <img src="assets/favicon.png" alt="Glass Horizon Studio Emblem" class="studio-emblem" width="140" height="140">
            </div>

            <div class="status-badge">
                <span class="status-dot" aria-hidden="true"></span>
                <span>2027 Slate — In Pre-Production</span>
            </div>

            <h1 id="studio-heading">Glass Horizon</h1>
            <p class="studio-subtitle">Independent Game Studio</p>

            <p class="studio-statement">
                We build focused, replayable, systems-driven indie games.
                Our next project begins development in 2027.
            </p>

            <nav class="studio-actions" aria-label="Studio links">
                <a href="mailto:contact@glasshorizongames.com" class="btn btn-primary">
                    Contact Studio
                </a>
                <a href="https://x.com/GlassHorizonDev" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
                    Follow on X
                </a>
            </nav>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="copyright-year">2026</span> Glass Horizon. All rights reserved. &bull; Ontario, Canada</p>
    </footer>

    <script>
        document.getElementById("copyright-year").textContent = new Date().getFullYear();
    </script>
</body>
</html>
